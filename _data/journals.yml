- title: "Investors Are (Not) Always Right: A Comparison of Transaction-Based and Profitability-Based Metrics for Financial Asset Recommendations"
  authors:
    - Javier Sanz-Cruzado
    - Richard McCreadie
    - Nikolaos Droukas
    - Craig Macdonald
    - Iadh Ounis
  journal: ACM Transactions on Information Systems
  date: December 2025
  volume: tbp
  abstract: "The use of recommender systems to assist in the provision of financial asset and portfolio recommendations to investors is increasing, spanning a wide range of algorithms and techniques. Several strategies have been devised for the evaluation of financial asset recommendations, with the two most prominent perspectives measuring, respectively, (a) the money customers could obtain if they followed the recommendations (profitability-based evaluation) and (b) the ability of models to predict future customer investments (transaction-based evaluation). If customers are effective investors, we would expect these two perspectives to be positively correlated. In this paper, we explore the actual relation between these two families of metrics. Theoretically, we prove that these perspectives are independent. Furthermore, we perform experiments over a large-scale financial recommendation dataset with real customer investment transactions. Surprisingly, we find that transaction and profitability-based metrics are, in fact, negatively correlated. Moreover, algorithms that actively learn from past customer transactions might lose money in the mid-term. A thorough analysis of model performance and customer transaction patterns over time shows that this is due to customers failing to consistently beat the market with their investments, with time appearing as an important confounding variable -- since the point of time where recommendations are provided and the investment horizon largely affect the customer's investment performance."
  link: https://javiersanzcruza.github.io/assets/papers/tois2025.pdf
  poster: https://javiersanzcruza.github.io/assets/posters/tois2025.pdf
  doi: http://dx.doi.org/10.1145/3780097
  keywords:
  - recommender systems
  - financial recommendation
  - evaluation
  - metric
  - profitability
  - interactions
- title: Effective Contact Recommendation in Social Networks by Adaptation of Information Retrieval Models
  authors:
    - Javier Sanz-Cruzado
    - Pablo Castells
    - Craig Macdonald
    - Iadh Ounis
  journal: Information Processing & Management
  volume: 57
  issue: 5
  articleid: 102285
  abstract: >+
    We investigate a novel perspective to the development of effective algorithms for contact recommendation in social networks, where the problem consists of automatically predicting people that a given user may wish or benefit from connecting to in the network. Specifically, we explore the connection between contact recommendation and the text information retrieval (IR) task, by investigating the adaptation of IR models (classical and supervised) for recommending people in social networks, using only the structure of these networks.
    
    We first explore the use of adapted unsupervised IR models as direct standalone recommender systems. Seeking additional effectiveness enhancements, we further explore the use of IR models as neighbor selection methods, in place of common similarity measures, in user-based and item-based nearest-neighbors (kNN) collaborative filtering approaches. On top of this, we investigate the application of learning to rank approaches borrowed from text IR to achieve additional improvements.
   
    We report thorough experiments over data obtained from Twitter and Facebook where we observe that IR models, particularly BM25, are competitive compared to state-of-the art contact recommendation methods. We provide further empirical analysis of the additional effectiveness that can be achieved by the integration of IR models into kNN and learning to rank schemes. Our research shows that the IR models are effective in three roles: as direct contact recommenders, as neighbor selectors in collaborative filtering and as samplers and features in learning to rank.
  keywords: 
    - social networks
    - recommender systems
    - contact recommendation
    - information retrieval models
    - collaborative filtering
    - k nearest neighbors
    - learning to rank
  link: https://javiersanzcruza.github.io/assets/papers/ipm2020.pdf
  doi: https://doi.org/10.1016/j.ipm.2020.102285
